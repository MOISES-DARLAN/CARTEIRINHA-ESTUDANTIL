{% extends 'alunos/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card carteirinha-card shadow-lg">
            <div class="card-header text-center border-0 pt-3">
                <h4>Carteirinha de Estudante</h4>
            </div>
            <div class="card-body p-4">
                <div class="text-center mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-person-badge" viewBox="0 0 16 16">
                      <path d="M6.5 2a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1zM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                      <path d="M4.5 0A2.5 2.5 0 0 0 2 2.5v11A2.5 2.5 0 0 0 4.5 16h7a2.5 2.5 0 0 0 2.5-2.5v-11A2.5 2.5 0 0 0 11.5 0zM3 2.5A1.5 1.5 0 0 1 4.5 1h7A1.5 1.5 0 0 1 13 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13.5z"/>
                    </svg>
                </div>
                <h5 class="card-title text-center">{{ aluno.nome_completo }}</h5>
                <hr>
                <p class="card-text mb-2"><strong>Matrícula:</strong> {{ aluno.matricula }}</p>
                <p class="card-text mb-2"><strong>CPF:</strong> {{ aluno.cpf }}</p>
                <p class="card-text mb-2"><strong>Vencimento:</strong> {{ aluno.data_vencimento_assinatura|date:"d/m/Y" }}</p>
                <p class="card-text mb-0 text-center mt-3"><span class="badge bg-light text-dark">Status: {{ aluno.status_pagamento }}</span></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
